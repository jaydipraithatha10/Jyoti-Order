<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jyoti Gruh Udhyog</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->
    <div id="header"></div>

    <!-- Main Content -->
    <main>

        <!-- Banner -->
        <section class="banner">

            <h1>Welcome to Jyoti Gruh Udhyog</h1>

            <p>Fresh • Pure • Homemade</p>

        </section>

        <!-- Search -->
        <section class="search-box">

            <input
                type="text"
                id="search"
                placeholder="Search Products...">

        </section>

        <!-- Categories -->
        <section>

            <h2 class="title">Categories</h2>

            <div id="categoryList" class="grid"></div>

        </section>

        <!-- Featured -->
        <section>

            <h2 class="title">Featured Products</h2>

            <div id="featuredList" class="grid"></div>

        </section>

    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="include.js"></script>
    <script src="api.js"></script>

</body>

</html>
